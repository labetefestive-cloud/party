<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 Party Links 🎉</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="avatar">🎊</div>
      <h1>Let's Party!</h1>
      <p class="bio">Join the celebration - find all my links here!</p>
    </div>
    
    <div class="links">
      <a href="https://twitter.com/" target="_blank" class="link">
        <span class="icon">🐦</span>
        <span class="text">Twitter</span>
      </a>
      <a href="https://instagram.com/" target="_blank" class="link">
        <span class="icon">📸</span>
        <span class="text">Instagram</span>
      </a>
      <a href="https://github.com/" target="_blank" class="link">
        <span class="icon">💻</span>
        <span class="text">GitHub</span>
      </a>
      <a href="https://youtube.com/" target="_blank" class="link">
        <span class="icon">🎥</span>
        <span class="text">YouTube</span>
      </a>
      <a href="mailto:party@example.com" class="link">
        <span class="icon">✉️</span>
        <span class="text">Email Me</span>
      </a>
    </div>
    
    <footer>
      <p>Made with ❤️ and confetti</p>
    </footer>
  </div>
  
  <div class="confetti-container"></div>
  
  <script src="script.js"></script>
</body>
</html>
